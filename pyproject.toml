[project]
name = "whisper-transcribe"
version = "0.1.0"
description = "transcribe video file or http link"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.13.0"]

[project.scripts]
transcribe = "transcribe:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "transcribe"
module-root = ""
